<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Info API Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: #f0fdf4;
            border-radius: 50px;
            border: 2px solid #86efac;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #1f2937;
        }

        .card-value {
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
        }

        .card-subtitle {
            color: #6b7280;
            font-size: 0.95em;
            font-weight: 500;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(0);
        }

        .data-list {
            list-style: none;
            padding: 0;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #f3f4f6;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            font-weight: 600;
            color: #4b5563;
        }

        .data-value {
            color: #667eea;
            font-weight: 600;
            font-family: 'Monaco', monospace;
        }

        .websocket-log {
            background: #1f2937;
            border-radius: 15px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: #10b981;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .websocket-log::-webkit-scrollbar {
            width: 8px;
        }

        .websocket-log::-webkit-scrollbar-track {
            background: #374151;
            border-radius: 10px;
        }

        .websocket-log::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            border-left: 3px solid #667eea;
            animation: logSlide 0.3s ease;
        }

        @keyframes logSlide {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #dc2626;
            margin: 10px 0;
        }

        .success {
            background: #f0fdf4;
            color: #16a34a;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #16a34a;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .header h1 {
                font-size: 2em;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card-value {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>⛓️ Chain Info API Dashboard</h1>
                <p style="margin-top: 10px; color: #6b7280;">Real-time Polkadot Blockchain Data</p>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span style="font-weight: 600; color: #22c55e;">Connected</span>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">📦</div>
                    <h2 class="card-title">Latest Block</h2>
                </div>
                <div class="card-value" id="latestBlock">
                    <span class="loading"></span>
                </div>
                <p class="card-subtitle">Current blockchain height</p>
                <button class="button" onclick="fetchLatestBlock()" style="margin-top: 15px;">
                    🔄 Refresh
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">⚙️</div>
                    <h2 class="card-title">Chain Version</h2>
                </div>
                <ul class="data-list" id="versionInfo">
                    <li class="data-item">
                        <span class="data-label">Loading...</span>
                        <span class="loading"></span>
                    </li>
                </ul>
                <button class="button" onclick="fetchChainVersion()" style="margin-top: 15px;">
                    🔄 Refresh
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">🏥</div>
                    <h2 class="card-title">Health Status</h2>
                </div>
                <ul class="data-list" id="healthInfo">
                    <li class="data-item">
                        <span class="data-label">Loading...</span>
                        <span class="loading"></span>
                    </li>
                </ul>
                <button class="button" onclick="fetchHealth()" style="margin-top: 15px;">
                    🔄 Check Health
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon">💎</div>
                <h2 class="card-title">Chain Constants</h2>
            </div>
            <ul class="data-list" id="constantsInfo">
                <li class="data-item">
                    <span class="data-label">Loading...</span>
                    <span class="loading"></span>
                </li>
            </ul>
            <button class="button" onclick="fetchConstants()" style="margin-top: 15px;">
                🔄 Refresh Constants
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon">🔌</div>
                <h2 class="card-title">WebSocket Live Feed</h2>
            </div>
            <div class="websocket-log" id="wsLog">
                <div class="log-entry">Initializing WebSocket connection...</div>
            </div>
            <button class="button" onclick="connectWebSocket()" style="margin-top: 15px;">
                🔄 Reconnect
            </button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3005';
        const WS_URL = 'ws://localhost:3005/ws';
        let ws = null;

        async function fetchLatestBlock() {
            const el = document.getElementById('latestBlock');
            el.innerHTML = '<span class="loading"></span>';
            try {
                const res = await fetch(`${API_BASE}/api/chain/latest`);
                const data = await res.json();
                el.textContent = data.data.blockNumber.toLocaleString();
            } catch (error) {
                el.innerHTML = '<span style="color: #dc2626;">Error</span>';
                console.error('Error fetching latest block:', error);
            }
        }

        async function fetchChainVersion() {
            const el = document.getElementById('versionInfo');
            el.innerHTML = '<li class="data-item"><span class="data-label">Loading...</span><span class="loading"></span></li>';
            try {
                const res = await fetch(`${API_BASE}/api/chain/version`);
                const data = await res.json();
                const version = data.data;
                el.innerHTML = `
                    <li class="data-item"><span class="data-label">Spec Name</span><span class="data-value">${version.specName}</span></li>
                    <li class="data-item"><span class="data-label">Spec Version</span><span class="data-value">${version.specVersion}</span></li>
                    <li class="data-item"><span class="data-label">Impl Version</span><span class="data-value">${version.implVersion}</span></li>
                    <li class="data-item"><span class="data-label">Transaction Version</span><span class="data-value">${version.transactionVersion}</span></li>
                `;
            } catch (error) {
                el.innerHTML = '<li class="data-item"><span class="error">Failed to fetch version info</span></li>';
                console.error('Error fetching chain version:', error);
            }
        }

        async function fetchHealth() {
            const el = document.getElementById('healthInfo');
            el.innerHTML = '<li class="data-item"><span class="data-label">Loading...</span><span class="loading"></span></li>';
            try {
                const res = await fetch(`${API_BASE}/api/health`);
                const data = await res.json();
                const uptime = Math.floor(data.uptime);
                el.innerHTML = `
                    <li class="data-item"><span class="data-label">Status</span><span class="data-value" style="color: ${data.status === 'healthy' ? '#22c55e' : '#dc2626'}">${data.status.toUpperCase()}</span></li>
                    <li class="data-item"><span class="data-label">Uptime</span><span class="data-value">${uptime}s</span></li>
                    <li class="data-item"><span class="data-label">PAPI</span><span class="data-value" style="color: ${data.checks.papi.status === 'healthy' ? '#22c55e' : '#dc2626'}">${data.checks.papi.status}</span></li>
                    <li class="data-item"><span class="data-label">Cache</span><span class="data-value" style="color: ${data.checks.cache.status === 'healthy' ? '#22c55e' : '#dc2626'}">${data.checks.cache.status}</span></li>
                `;
            } catch (error) {
                el.innerHTML = '<li class="data-item"><span class="error">Failed to fetch health status</span></li>';
                console.error('Error fetching health:', error);
            }
        }

        async function fetchConstants() {
            const el = document.getElementById('constantsInfo');
            el.innerHTML = '<li class="data-item"><span class="data-label">Loading...</span><span class="loading"></span></li>';
            try {
                const res = await fetch(`${API_BASE}/api/chain/constants`);
                const data = await res.json();
                const constants = data.data;
                let html = '';
                
                if (constants.system) {
                    html += `<li class="data-item"><span class="data-label">Block Hash Count</span><span class="data-value">${constants.system.blockHashCount}</span></li>`;
                }
                if (constants.balances) {
                    html += `<li class="data-item"><span class="data-label">Existential Deposit</span><span class="data-value">${constants.balances.existentialDeposit}</span></li>`;
                }
                if (constants.timestamp) {
                    html += `<li class="data-item"><span class="data-label">Minimum Period</span><span class="data-value">${constants.timestamp.minimumPeriod}</span></li>`;
                }
                
                el.innerHTML = html || '<li class="data-item"><span class="data-label">No constants available</span></li>';
            } catch (error) {
                el.innerHTML = '<li class="data-item"><span class="error">Failed to fetch constants</span></li>';
                console.error('Error fetching constants:', error);
            }
        }

        function connectWebSocket() {
            const logEl = document.getElementById('wsLog');
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                addLog('Already connected to WebSocket');
                return;
            }

            addLog('Connecting to WebSocket...');
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                addLog('✅ WebSocket connected successfully!', 'success');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'block') {
                    addLog(`📦 New Block: #${data.data.number} at ${new Date(data.data.timestamp).toLocaleTimeString()}`);
                } else {
                    addLog(`📨 ${data.type}: ${JSON.stringify(data)}`);
                }
            };
            
            ws.onerror = (error) => {
                addLog('❌ WebSocket error occurred', 'error');
            };
            
            ws.onclose = () => {
                addLog('🔌 WebSocket disconnected', 'error');
            };
        }

        function addLog(message, type = 'info') {
            const logEl = document.getElementById('wsLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            if (type === 'error') entry.style.borderLeftColor = '#dc2626';
            if (type === 'success') entry.style.borderLeftColor = '#22c55e';
            logEl.insertBefore(entry, logEl.firstChild);
            
            // Keep only last 50 entries
            while (logEl.children.length > 50) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        // Initialize dashboard
        window.onload = () => {
            fetchLatestBlock();
            fetchChainVersion();
            fetchHealth();
            fetchConstants();
            connectWebSocket();
            
            // Auto-refresh latest block every 10 seconds
            setInterval(fetchLatestBlock, 10000);
        };
    </script>
</body>
</html>
