<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 14: Observables vs Promises - PAPI 30-Day Challenge</title>
    <meta name="description" content="Real-time vs One-time blockchain data fetching with Polkadot-API">
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        overflow-x: hidden;
      }
      
      /* Loading animation */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0D0D0D 0%, #1A1A1A 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(230, 0, 122, 0.3);
        border-top: 3px solid #E6007A;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #fff;
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        text-align: center;
      }
      
      .loading-text .highlight {
        background: linear-gradient(45deg, #E6007A, #00B2FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">
        Loading <span class="highlight">PAPI Day 14</span> Demo...
      </div>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="./src/main.tsx"></script>
    
    <script>
      // Hide loading screen when content is loaded
      window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }
      });
    </script>
  </body>
</html>
